<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login Portal</title>
    <style>
        :root {
            --primary-color: #0F9E99;
            --primary-hover: #0b7a76;
            --bg-color: #EFE9E0;
            --card-bg: #FFFFFF;
            --text-color: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .hidden { display: none; }
        
        h1 { color: var(--primary-color); margin-bottom: 1rem; }
        p { color: var(--text-color); line-height: 1.5; }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    <!-- CLERK SCRIPT -->
    <script
        async
        crossorigin="anonymous"
        data-clerk-publishable-key="pk_test_cHJlcGFyZWQtZmFsY29uLTU2LmNsZXJrLmFjY291bnRzLmRldiQ"
        src="https://prepared-falcon-56.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
        type="text/javascript">
    </script>
</head>
<body>

    <div class="container">
        <!-- Loading -->
        <div id="loading">
            <div class="loader"></div>
            <p>Verifying access...</p>
        </div>

        <!-- Login Box -->
        <div id="signed-out" class="hidden">
            <h1>Welcome Back</h1>
            <p>Please sign in to access the dashboard.</p>
            <div id="clerk-sign-in"></div>
        </div>

        <!-- Redirect Message (Optional, seen briefly before redirect) -->
        <div id="signed-in" class="hidden">
            <h1>✅ Success</h1>
            <p>Redirecting to dashboard...</p>
            <div class="loader"></div>
        </div>
    </div>

    <script>
        // CHANGE THIS TO YOUR DESTINATION PAGE
        const REDIRECT_URL = "https://mmoh16.github.io/bulk-sender/data-View.html"; 

        window.addEventListener("load", async function () {
            await Clerk.load();

            if (Clerk.user) {
                // 1. User is ALREADY logged in -> Redirect immediately
                document.getElementById("loading").classList.add("hidden");
                document.getElementById("signed-in").classList.remove("hidden");
                window.location.href = REDIRECT_URL;
            } else {
                // 2. User is NOT logged in -> Show Sign In form
                document.getElementById("loading").classList.add("hidden");
                document.getElementById("signed-out").classList.remove("hidden");
                
                Clerk.mountSignIn(document.getElementById("clerk-sign-in"), {
                    appearance: {
                        variables: { colorPrimary: '#0F9E99' }
                    },
                    // 3. This tells Clerk where to go AFTER they finish signing in
                    afterSignInUrl: REDIRECT_URL,
                    afterSignUpUrl: REDIRECT_URL
                });
            }
        });
    </script>
</body>
</html>
